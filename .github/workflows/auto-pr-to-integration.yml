# Opens a draft PR into the integration branch when you push a *different* branch.
# GitHub does not create PRs on `git push` by itself; `pr-gate` only merges existing PRs.
#
# Pushes directly to `feat/dingyi` do NOT get a PR (you are already on the integration branch).
# Use a feature branch (e.g. `feat/go2-spin`) and push — this workflow opens
# `feat/go2-spin` → `feat/dingyi` if no open PR exists yet.

name: Auto-open PR to integration branch

on:
  push:
    branches-ignore:
      - main
      - dev
      - feat/dingyi

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = 'feat/dingyi';
            const head = context.ref.replace('refs/heads/', '');
            const headLabel = `${owner}:${head}`;

            const { data: open } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: headLabel,
              base,
              per_page: 10,
            });
            if (open.length > 0) {
              core.info(`Open PR already exists: #${open[0].number}`);
              return;
            }

            const { data: created } = await github.rest.pulls.create({
              owner,
              repo,
              title: `[auto] ${head}`,
              head,
              base,
              draft: true,
              body:
                'Draft PR opened by [`auto-pr-to-integration`](.github/workflows/auto-pr-to-integration.yml).\n\n' +
                'Edit title/body, mark ready for review, then let CI + `pr-gate` run.',
            });
            core.info(`Created draft PR #${created.number}: ${created.html_url}`);
