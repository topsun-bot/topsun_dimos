name: Auto Merge

# Auto-enable GitHub auto-merge once Codex Cloud (chatgpt-codex-connector[bot])
# has reviewed the PR and left no P0 or P1 inline comments on the current HEAD.
#
# Codex signals approval via a text comment ("Didn't find any major issues…"),
# NOT a 👍 reaction. This workflow therefore checks:
#   1. Has Codex posted at least one issue comment on this PR?  → review received
#   2. Are there zero P0/P1 inline review comments for HEAD?   → no blocking issues
# Both conditions true → enable GitHub auto-merge (squash).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to re-check
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    # Skip non-PR issue comments and draft PRs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      CODEX_BOT: chatgpt-codex-connector
    steps:
      - name: Resolve PR number
        id: pr
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            issue_comment)      N="${{ github.event.issue.number }}" ;;
            workflow_dispatch)  N="${{ inputs.pr_number }}" ;;
            *)                  N="${{ github.event.pull_request.number }}" ;;
          esac
          echo "number=$N" >> "$GITHUB_OUTPUT"

      - name: Fetch PR metadata
        id: meta
        run: |
          set -euo pipefail
          PR_JSON=$(gh api "repos/$REPO/pulls/${{ steps.pr.outputs.number }}")
          echo "draft=$(echo "$PR_JSON" | jq -r .draft)"    >> "$GITHUB_OUTPUT"
          echo "state=$(echo "$PR_JSON" | jq -r .state)"    >> "$GITHUB_OUTPUT"
          echo "sha=$(echo   "$PR_JSON" | jq -r .head.sha)" >> "$GITHUB_OUTPUT"
          echo "url=$(echo   "$PR_JSON" | jq -r .html_url)" >> "$GITHUB_OUTPUT"

      - name: Poll for Codex clean review (max 30 min)
        if: steps.meta.outputs.draft == 'false' && steps.meta.outputs.state == 'open'
        id: check
        env:
          HEAD_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          PR=${{ steps.pr.outputs.number }}

          # Returns: "pending" | "clean" | "issues:<count>"
          codex_status() {
            # 1) Has Codex posted any issue comment on this PR?
            COMMENT_COUNT=$(gh api "repos/$REPO/issues/$PR/comments" --jq \
              "[.[] | select((.user.login | ascii_downcase) | startswith(\"$CODEX_BOT\"))] | length")
            if [ "$COMMENT_COUNT" -eq 0 ]; then
              echo "pending"
              return
            fi

            # 2) Count P0/P1 inline review comments on the current HEAD commit
            P1_COUNT=$(gh api "repos/$REPO/pulls/$PR/comments" --jq \
              "[.[] | select(
                ((.user.login | ascii_downcase) | startswith(\"$CODEX_BOT\")) and
                .commit_id == \"$HEAD_SHA\" and
                (.body | (contains(\"[P0\") or contains(\"[P1\")))
              )] | length")

            if [ "$P1_COUNT" -gt 0 ]; then
              echo "issues:$P1_COUNT"
            else
              echo "clean"
            fi
          }

          MAX_ITERATIONS=60   # 60 × 30s = 30 min
          INTERVAL=30
          for i in $(seq 1 $MAX_ITERATIONS); do
            STATE=$(gh api "repos/$REPO/pulls/$PR" --jq .state)
            if [ "$STATE" != "open" ]; then
              echo "PR #$PR no longer open (state=$STATE); aborting."
              echo "ok=false"     >> "$GITHUB_OUTPUT"
              echo "reason=pr_closed" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            STATUS=$(codex_status)
            echo "[$(date -u +%H:%M:%S)] iteration $i/$MAX_ITERATIONS — Codex status: $STATUS"

            case "$STATUS" in
              clean)
                echo "ok=true"       >> "$GITHUB_OUTPUT"
                echo "reason=clean"  >> "$GITHUB_OUTPUT"
                echo "Codex review clean on iteration $i — enabling auto-merge."
                exit 0
                ;;
              issues:*)
                COUNT="${STATUS#issues:}"
                echo "ok=false"          >> "$GITHUB_OUTPUT"
                echo "reason=issues"     >> "$GITHUB_OUTPUT"
                echo "p1_count=$COUNT"   >> "$GITHUB_OUTPUT"
                echo "Codex found $COUNT P0/P1 issue(s) — blocking auto-merge."
                exit 0
                ;;
              pending)
                ;;
            esac

            [ "$i" -lt "$MAX_ITERATIONS" ] && sleep $INTERVAL
          done

          echo "ok=false"        >> "$GITHUB_OUTPUT"
          echo "reason=timeout"  >> "$GITHUB_OUTPUT"

      - name: Enable GitHub auto-merge
        if: steps.check.outputs.ok == 'true'
        run: gh pr merge "${{ steps.meta.outputs.url }}" --auto --squash --delete-branch

      - name: Blocked — Codex found P0/P1 issues
        if: steps.check.outputs.ok == 'false' && steps.check.outputs.reason == 'issues'
        run: |
          echo "::error title=Auto-merge blocked::PR #${{ steps.pr.outputs.number }} has ${{ steps.check.outputs.p1_count }} P0/P1 Codex finding(s) on HEAD. Fix the issues and push a new commit to re-trigger the review."

      - name: Timed out waiting for Codex
        if: steps.check.outputs.ok == 'false' && steps.check.outputs.reason == 'timeout'
        run: |
          echo "::notice title=Auto-merge gated (timeout)::PR #${{ steps.pr.outputs.number }} polled 30 min and saw no Codex review. Trigger '@codex review', then re-run this workflow: Actions → Auto Merge → Run workflow → pr_number=${{ steps.pr.outputs.number }}."
