name: macos

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docker/**'
      - '.github/workflows/docker-build.yml'
      - '.github/workflows/_docker-build-template.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  check-changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            python:
              - 'dimos/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/macos.yml'

  checks:
    needs: [check-changes]
    if: needs.check-changes.outputs.should-run == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-timeout mypy
          pip install -e . || true
          pip install -r requirements.txt || true

      - name: Type check (mypy)
        run: mypy dimos/ --ignore-missing-imports --no-error-summary || true

      - name: Syntax check
        run: python3 -m compileall -q dimos/

      - name: Fast tests
        run: |
          python3 -m pytest tests/ dimos/ -v --tb=short -m "not slow" --timeout=30 \
            -p no:cacheprovider --noconftest 2>&1 || true
