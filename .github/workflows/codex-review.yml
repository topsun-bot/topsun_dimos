name: Codex Auto Review

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codex-review:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Compute diff range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE" ]; then
              BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            fi
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "Diff range: $BASE..$HEAD"

      - name: Run Codex review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e
          DIFF=$(git diff "${{ steps.range.outputs.base }}".."${{ steps.range.outputs.head }}" | head -c 200000)
          if [ -z "$DIFF" ]; then
            echo "LGTM — no diff to review." > review.md
            exit 0
          fi

          PROMPT=$(cat <<'PROMPT_EOF'
You are reviewing a PR for DimOS — an agentic operating system for generalist robotics. Project context is in AGENTS.md (read it for module structure, blueprint conventions, MCP server API).

Review the diff below. Focus strictly on:
1. Type safety (mypy compliance — DimOS enforces mypy)
2. Skill / Blueprint contract changes (dimos/skills/, dimos/agents/, dimos/blueprints/)
3. ROS / MCP API breakage (anything touching McpServer / McpClient or ROS topic names)
4. New imports missing from pyproject.toml
5. Obvious bugs (off-by-one, None deref, async misuse)

Rules:
- Be terse. Use bullet points.
- Skip nitpicks (style, naming preferences).
- If nothing serious: reply with exactly "LGTM".
- Use GitHub-flavored markdown. Reference file paths as `path/to/file.py:LINE`.

PROMPT_EOF
)

          {
            echo "$PROMPT"
            echo
            echo '```diff'
            echo "$DIFF"
            echo '```'
          } > prompt.txt

          codex exec --model gpt-5-codex --skip-git-repo-check \
            "$(cat prompt.txt)" > review.md 2> codex.err || {
              echo "Codex CLI failed:" > review.md
              echo '```' >> review.md
              tail -n 50 codex.err >> review.md
              echo '```' >> review.md
            }
          echo "----- review -----"
          cat review.md

      - name: Post review as comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(printf '## 🤖 Codex Review\n\n%s' "$(cat review.md)")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" \
              --body "$BODY"
          else
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -f body="$BODY"
          fi
