name: ci
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  ci-complete:
    # Heavy ROS/uv/mypy/coverage suite has been disabled while the
    # team moves to GitHub-hosted runners. PR Gate (pr-gate.yml) is
    # the actual quality gate that pr-loop consumes. Re-enable the
    # steps below once a Linux runner with ROS is back online.
    if: >
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.draft == false &&
        (
          github.event.action != 'labeled' ||
          github.event.label.name == 'automerge'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: CI placeholder (heavy tests disabled)
        run: |
          echo "ci-complete: heavy ROS/uv/mypy/coverage suite is temporarily disabled."
          echo "The active PR quality gate is pr-gate.yml (PR Gate workflow)."
