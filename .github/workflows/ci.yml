name: ci
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - '**.md'

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  ci-complete:
    if: >
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.draft == false &&
        (
          github.event.action != 'labeled' ||
          github.event.label.name == 'automerge'
        )
      )
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --all-extras --no-extra dds --no-extra unitree-dds --frozen

      - name: Remove pydrake stubs
        run: |
          find .venv/lib/*/site-packages/pydrake -name '*.pyi' -delete 2>/dev/null || true

      - name: Run tests
        run: |
          source .venv/bin/activate
          _DIMOS_COV=1 coverage run -m pytest --junitxml=junit.xml --durations=0 -m 'not (tool or mujoco)' \
            && coverage combine \
            && coverage xml

      - name: Run mypy
        if: ${{ !cancelled() }}
        run: |
          source .venv/bin/activate
          mypy dimos

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage.xml
          use_oidc: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          report_type: test_results
          use_oidc: true

      - name: Check disk space
        if: failure()
        run: |
          df -h
