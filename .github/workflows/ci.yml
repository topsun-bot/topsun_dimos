name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - '**.md'

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  ci-complete:
    if: >
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.draft == false &&
        (
          github.event.action != 'labeled' ||
          github.event.label.name == 'automerge'
        )
      )
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      # Public ROS 2 Humble image — ghcr.io/dimensionalos/ros-dev is private and
      # this repo's GITHUB_TOKEN cannot pull it without extra registry credentials.
      image: docker.io/osrf/ros:humble-desktop-full-jammy
      env:
        ROS_DISTRO: humble
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}

    steps:
      - uses: actions/checkout@v5
        with:
          clean: false

      - name: Fix permissions
        run: |
          git config --global --add safe.directory '*'
          git clean -ffdx -e .venv

      - name: Install system packages for native wheels
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            portaudio19-dev \
            pkg-config \
            build-essential

      - uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: uv sync --extra all --frozen

      - name: Remove pydrake stubs
        run: |
          find .venv/lib/*/site-packages/pydrake -name '*.pyi' -delete 2>/dev/null || true

      - name: Run tests
        run: |
          bash -lc "source /opt/ros/humble/setup.bash && source .venv/bin/activate && _DIMOS_COV=1 coverage run -m pytest --junitxml=junit.xml --durations=0 -m 'not (tool or mujoco)' && coverage combine && coverage xml"

      - name: Run mypy
        if: ${{ !cancelled() }}
        run: |
          bash -lc "source /opt/ros/humble/setup.bash && source .venv/bin/activate && MYPYPATH=/opt/ros/humble/lib/python3.10/site-packages mypy dimos"

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage.xml
          use_oidc: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          report_type: test_results
          use_oidc: true

      - name: Check disk space
        if: failure()
        run: |
          df -h
