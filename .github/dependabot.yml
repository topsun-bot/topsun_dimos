version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # https://blog.yossarian.net/2025/11/21/We-should-all-be-using-dependency-cooldowns
    cooldown:
      default-days: 7
    # Majors stay ungrouped so each lands as its own PR.
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/"
    # Can't use "all" because it exceeds the 55 min timeout and fails to open any PRs.
    allow:
      - dependency-type: "direct"
    schedule:
      interval: "weekly"
    # https://blog.yossarian.net/2025/11/21/We-should-all-be-using-dependency-cooldowns
    cooldown:
      default-days: 7
    # Room for the weekly minor/patch group plus several individual majors.
    open-pull-requests-limit: 15
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories: ["/docker/*/"]
    schedule:
      interval: "weekly"
    # https://blog.yossarian.net/2025/11/21/We-should-all-be-using-dependency-cooldowns
    cooldown:
      default-days: 7
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # https://blog.yossarian.net/2025/11/21/We-should-all-be-using-dependency-cooldowns
    cooldown:
      default-days: 7
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
