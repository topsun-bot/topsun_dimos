[pytest]
testpaths =
    unit
    integration
    regression
    framework
pythonpath =
    .
markers =
    unit: 单元测试层
    integration: 集成测试层
    regression: 回归测试层
    quality_gate: Quality Gate 框架自检
addopts =
    -v
    -ra
    --strict-markers
    --import-mode=importlib
    -p no:launch_testing
    -p no:launch_ros
filterwarnings =
    ignore::DeprecationWarning
